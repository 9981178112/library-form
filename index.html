<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>माँ सरस्वती लाइब्रेरी - पूछताछ</title>
<style>
:root{--bg:#f2f4f9;--card:#fff;--ink:#101828;--mut:#667085;--acc:#2447d6;--on:#fff;--line:#e4e7ee;--ok:#12805c;--bad:#d92d20;--g1:#0b2a6b;--g2:#2f5bea}
@media (prefers-color-scheme:dark){:root{--bg:#0c1220;--card:#141c30;--ink:#eef1f8;--mut:#94a0bb;--acc:#8fa8ff;--on:#0c1220;--line:#232d49;--ok:#5fd6a0;--bad:#ff8a80;--g1:#14275a;--g2:#2a46a8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:16px}
.hd{border-radius:18px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));margin-bottom:14px}
.hd h1{margin:0;font-size:1.3rem}.hd p{margin:4px 0 0;opacity:.9;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-size:.85rem;font-weight:600;color:var(--mut);margin-top:12px}
input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-top:4px}
input:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:var(--acc);color:var(--on);font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.msg{margin-top:14px;padding:12px;border-radius:10px;font-size:.95rem;display:none}
.msg.ok{display:block;background:rgba(18,183,106,.14);color:var(--ok)}
.msg.bad{display:block;background:rgba(217,45,32,.12);color:var(--bad)}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd"><h1>माँ सरस्वती लाइब्रेरी</h1><p>सीट की पूछताछ के लिए फॉर्म भरें। हम जल्द संपर्क करेंगे।</p></div>
 <div class="card" id="box">
  <label for="n">आपका नाम</label><input id="n" maxlength="60" autocomplete="name" placeholder="नाम">
  <label for="p">मोबाइल नंबर</label><input id="p" type="tel" maxlength="20" autocomplete="tel" placeholder="मोबाइल नंबर">
  <label for="s">शिफ्ट</label>
  <select id="s"><option value="Full">पूरा दिन</option><option value="Morning">सुबह</option><option value="Evening">शाम</option></select>
  <label for="t">कुछ और बताना हो (वैकल्पिक)</label><input id="t" maxlength="200" placeholder="जैसे: कब से जॉइन करना है">
  <div class="hp"><label for="w">Website</label><input id="w" tabindex="-1" autocomplete="off"></div>
  <button id="b" onclick="send()">पूछताछ भेजें</button>
  <div class="msg" id="m"></div>
 </div>
</div>
<script>
var WA="919981178112";
var FB={key:"AIzaSyBYz-ZzS0uhV_x-cb9lbzSsDcAIn11_W3g",pid:"ma-saraswati-library"};
function $(i){return document.getElementById(i)}
function show(t,c){var m=$("m");m.textContent=t;m.className="msg "+c}
function today(){var d=new Date(),z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
async function send(){
 if($("w").value)return;
 var n=$("n").value.trim(),p=$("p").value.trim(),s=$("s").value,t=$("t").value.trim();
 if(!n&&!p)return show("नाम या मोबाइल नंबर, कुछ तो लिखें","bad");
 try{var last=+localStorage.getItem("enq_last")||0;if(Date.now()-last<60000)return show("कृपया 1 मिनट बाद दोबारा भेजें","bad")}catch(e){}
 var b=$("b");b.disabled=true;show("भेजा जा रहा है...","ok");
 var body={fields:{name:{stringValue:n},phone:{stringValue:p},shift:{stringValue:s},note:{stringValue:t},status:{stringValue:"New"},date:{stringValue:today()}}};
 try{
  var r=await fetch("https://firestore.googleapis.com/v1/projects/"+FB.pid+"/databases/(default)/documents/enquiries?key="+FB.key,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){var j=await r.json().catch(function(){return{}});throw new Error((j.error&&j.error.message)||r.status)}
  try{localStorage.setItem("enq_last",String(Date.now()))}catch(e){}
  var SHL={Full:"पूरा दिन",Morning:"सुबह",Evening:"शाम"},msg="नमस्ते, माँ सरस्वती लाइब्रेरी में सीट की पूछताछ।\nनाम: "+(n||"-")+"\nमोबाइल: "+(p||"-")+"\nशिफ्ट: "+SHL[s]+(t?"\nटिप्पणी: "+t:"")+"\n\n📖 माँ सरस्वती लाइब्रेरी📖",link="https://wa.me/"+WA+"?text="+encodeURIComponent(msg);
  $("box").innerHTML='<h2 style="margin:0 0 6px">धन्यवाद!</h2><p style="color:var(--mut);margin:0 0 12px">आपकी पूछताछ मिल गई है। हम जल्द आपसे संपर्क करेंगे।</p><p style="margin:0 0 12px">जल्दी जवाब के लिए व्हाट्सऐप पर भी भेज दें:</p><a href="'+link+'" style="display:block;text-align:center;padding:13px;border-radius:10px;background:#25d366;color:#04230f;font-weight:700;text-decoration:none">व्हाट्सऐप पर भेजें</a>';
  setTimeout(function(){location.href=link},1500);
 }catch(e){b.disabled=false;show("पूछताछ नहीं गई। इंटरनेट जाँचकर दोबारा कोशिश करें। ("+e.message+")","bad")}
}
</script>
</body>
</html>
