<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Library Manager</title>
<style>
:root{--bg:#f2f4f9;--card:#fff;--ink:#101828;--mut:#667085;--acc:#2447d6;--on:#fff;--acc2:#e9eefc;--bad:#d92d20;--ok:#12805c;--warn:#b54708;--line:#e4e7ee;--sh:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);--g1:#0b2a6b;--g2:#2f5bea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1220;--card:#141c30;--ink:#eef1f8;--mut:#94a0bb;--acc:#8fa8ff;--on:#0c1220;--acc2:#1d2848;--bad:#ff8a80;--ok:#5fd6a0;--warn:#f5c26b;--line:#232d49;--sh:none;--g1:#14275a;--g2:#2a46a8}}
:root[data-theme="dark"]{--bg:#0c1220;--card:#141c30;--ink:#eef1f8;--mut:#94a0bb;--acc:#8fa8ff;--on:#0c1220;--acc2:#1d2848;--bad:#ff8a80;--ok:#5fd6a0;--warn:#f5c26b;--line:#232d49;--sh:none;--g1:#14275a;--g2:#2a46a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:84px}
header{margin:12px auto 4px;width:calc(100% - 32px);max-width:608px;padding:16px;border-radius:18px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;display:flex;gap:12px;align-items:center;box-shadow:var(--sh)}
header h1{font-size:1.2rem;margin:0;color:#fff;letter-spacing:-.01em}
#today{font-size:.82rem;opacity:.85}
.logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
.logo svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:1.3rem;margin:0}
.sub{color:var(--mut);font-size:.88rem}
main{padding:6px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card>b:first-child{display:block;font-size:1rem;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:13px 14px;box-shadow:var(--sh)}
.tile span{display:block;color:var(--mut);font-size:.8rem}
.tile b{font-size:1.5rem;letter-spacing:-.02em}
.t1{--c:#2f5bea}.t2{--c:#7c4dff}.t3{--c:#f79009}.t4{--c:#12b76a}.t5{--c:#06aed4}.wide{grid-column:span 2}
.stat{flex:1;min-width:92px;background:var(--acc2);border-radius:12px;padding:10px;font-size:.8rem;color:var(--mut)}
.stat b{display:block;font-size:1.25rem;color:var(--ink)}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0}
input:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
label{font-size:.82rem;color:var(--mut);font-weight:600}
button,a.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--acc);color:var(--on);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button:active,a.btn:active{opacity:.8}
button.g,a.g{background:var(--acc2);color:var(--acc)}
button.d{background:transparent;color:var(--bad);padding:6px 8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item small{color:var(--mut);display:block;font-size:.8rem}
.tag{font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--acc2);color:var(--acc);white-space:nowrap}
.tag.bad{background:rgba(217,45,32,.12);color:var(--bad)}
.tag.warn{background:rgba(245,158,11,.16);color:var(--warn)}
.tag.ok{background:rgba(18,183,106,.14);color:var(--ok)}
.empty{color:var(--mut);padding:16px 0;text-align:center;font-size:.9rem}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.seats button{padding:12px 0;border-radius:10px;background:rgba(18,183,106,.12);color:var(--ok);border:1px solid rgba(18,183,106,.4);font-weight:700}
.seats button.half{background:rgba(245,158,11,.16);color:var(--warn);border-color:rgba(245,158,11,.5)}
.seats button.full{background:rgba(217,45,32,.12);color:var(--bad);border-color:rgba(217,45,32,.45)}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--acc2);flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--acc);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;margin:6px 0}
.chips button{padding:7px 14px;border-radius:99px;background:var(--card);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.chips button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(16,24,40,.06);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;color:var(--mut);border-radius:0;padding:9px 1px 8px;font-size:.66rem;font-weight:600}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
#lock[hidden]{display:none}
#lock .card{width:100%;max-width:320px;text-align:center;padding:24px}
.enq{padding:12px 0;border-bottom:1px solid var(--line)}.enq:last-child{border:0}
.enq .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.enq small{color:var(--mut);display:block;font-size:.8rem}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.cols{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.cols i{display:block;width:40%;border-radius:4px 4px 0 0;min-height:2px}
.c1{background:var(--ok)}.c2{background:var(--bad)}
.bar span{font-size:.7rem;color:var(--mut);margin-top:4px}
nav{overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none;min-width:68px}
</style>
</head>
<body>
<div id="lock"><div class="card"><div class="logo" style="margin:0 auto 12px;background:linear-gradient(135deg,var(--g1),var(--g2))"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5V5.5M8 7h8"/></svg></div><h1 id="lname">Library</h1><p class="sub">Admin PIN dalo</p><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button onclick="unlock()" style="width:100%;margin-top:8px">Kholo</button><p id="perr" class="sub" style="color:var(--bad)"></p></div></div>
<header><div class="logo"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5V5.5M8 7h8"/></svg></div><div><h1 id="title">Library Manager</h1><div id="today"></div></div></header>
<main id="view"></main>
<nav id="nav"></nav>
<script>
var QR=(function(){

 var bytes=utf8(text),v,cap;
 for(v=1;v<=20;v++){cap=Math.floor(raw(v)/8)-EC[v-1]*NB[v-1];if(4+(v<10?8:16)+bytes.length*8<=cap*8)break}

 var bits=[];function put(x,n){for(var i=n-1;i>=0;i--)bits.push((x>>>i)&1)}

 var all=[];for(i=0;i<blocks[0].length;i++)for(j=0;j<nb;j++)if(i!=sl-el||j>=ns)all.push(blocks[j][i]);

 var ap=[];if(v>1){var na=Math.floor(v/7)+2,st=v==32?26:Math.ceil((v*4+4)/(na*2-2))*2;ap=[6];for(var q=N-7;ap.length<na;q-=st)ap.splice(1,0,q)}
 for(i=0;i<ap.length;i++)for(j=0;j<ap.length;j++){if(i==0&&j==0||i==0&&j==ap.length-1||i==ap.length-1&&j==0)continue;for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++)set(ap[i]+dx,ap[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)}
 function fmt(mask){var d=mask,r=d;for(var i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);var bs=((d<<10)|r)^0x5412;function bt(i){return((bs>>>i)&1)!=0}

 fmt(0);
 if(v>=7){var r=v;for(i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);var vb=(v<<12)|r;for(i=0;i<18;i++){var c=((vb>>>i)&1)!=0,a=N-11+i%3,b2=Math.floor(i/3);set(a,b2,c);set(b2,a,c)}}
 i=0;for(var right=N-1;right>=1;right-=2){if(right==6)right=5;for(var vert=0;vert<N;vert++)for(j=0;j<2;j++){var x=right-j,up=((right+1)&2)==0,y=up?N-1-vert:vert;if(!f[y][x]&&i<all.length*8){m[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)!=0;i++}}}
 function mk(mask){for(var y=0;y<N;y++)for(var x=0;x<N;x++){if(f[y][x])continue;var inv;switch(mask){case 0:inv=(x+y)%2==0;break;case 1:inv=y%2==0;break;case 2:inv=x%3==0;break;case 3:inv=(x+y)%3==0;break;case 4:inv=(Math.floor(x/3)+Math.floor(y/2))%2==0;break;case 5:inv=x*y%2+x*y%3==0;break;case 6:inv=(x*y%2+x*y%3)%2==0;break;default:inv=((x+y)%2+x*y%3)%2==0}if(inv)m[y][x]=!m[y][x]}}
 function pen(){var s=0;for(var a=0;a<N;a++)for(var t=0;t<2;t++){var run=1;for(var b=1;b<N;b++){var c1=t?m[b][a]:m[a][b],c0=t?m[b-1][a]:m[a][b-1];if(c1==c0){run++;if(run==5)s+=3;else if(run>5)s++}else run=1}}return s}
 var best=0,bp=1e9;for(var mask=0;mask<8;mask++){mk(mask);fmt(mask);var pp=pen();if(pp<bp){bp=pp;best=mask}mk(mask)}
 mk(best);fmt(best);return m}

function wa(m,t){return"https://wa.me/91"+String(m.phone).replace(/\D/g,"").slice(-10)+"?text="+encodeURIComponent(t)}

function vHome(){
 var t=today(),mo=t.slice(0,7),coll=D.pays.filter(function(p){return p.date.slice(0,7)===mo}).reduce(function(a,p){return a+p.amt},0);
 var occ=0;for(var i=1;i<=D.seats;i++)if(seatState(i))occ++;
 var dues=D.members.filter(function(m){return dd(m.due,t)<=3}).sort(function(a,b){return a.due<b.due?-1:1});
 var h='<div class="grid"><div class="tile t1"><span>Students</span><b>'+D.members.length+'</b></div><div class="tile t2"><span>Seats bhari</span><b>'+occ+'/'+D.seats+'</b></div><div class="tile t3"><span>Due / overdue</span><b>'+dues.length+'</b></div><div class="tile t4"><span>Is mahine collection</span><b>Rs '+coll+'</b></div><div class="tile t5"><span>Is mahine bachat</span><b>Rs '+(coll-monthExp(mo))+'</b></div><div class="tile t2"><span>Nayi enquiry</span><b>'+D.enq.filter(function(e){return e.status==="New"}).length+'</b></div></div>';

function vSet(){
 return'<div class="card"><b>Library</b><label>Naam</label><input id="sn" value="'+esc(D.name)+'"><div class="row"><div style="flex:1"><label>Total seats</label><input id="ss" type="number" min="1" value="'+D.seats+'"></div><div style="flex:1"><label>Default fee</label><input id="sf" type="number" min="0" value="'+D.fee+'"></div></div><label>Admin PIN</label><input id="sp" type="password" inputmode="numeric" value="'+esc(D.pin)+'"><button onclick="saveSet()">Save karo</button></div>'
 +'<div class="card"><b>Backup aur export</b><p class="sub">Data sirf is phone ke browser me rehta hai. Backup zaroor lo.</p><div class="row"><button class="g" onclick="exp()">Backup download</button><button class="g" onclick="$(\'imp\').click()">Backup restore</button><button class="g" onclick="csv()">Members CSV</button><button class="g" onclick="csvp()">Payments CSV</button></div><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"></div>'}
function saveSet(){if(!$("sp").value.trim())return alert("PIN khali nahi ho sakta");var s=Math.max(1,+$("ss").value||1),mx=Math.max.apply(null,[0].concat(D.members.map(function(m){return+m.seat})));if(s<mx)return alert("Seat "+mx+" par member hai, isse kam seats nahi ho sakti");D.name=$("sn").value.trim()||"Library";D.seats=s;D.fee=+$("sf").value||0;D.pin=$("sp").value.trim();save();render();alert("Save ho gaya")}
function dl(name,type,txt){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function exp(){dl("library-backup.json","application/json",JSON.stringify(D))}
function csv(){var r=[["Naam","Phone","Seat","Shift","Fee","Join","Due date"]].concat(D.members.map(function(m){return[m.name,m.phone,m.seat,m.shift,m.fee,m.join,m.due]}));dl("members.csv","text/csv","\ufeff"+r.map(function(x){return x.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n"))}
function csvp(){var r=[["Date","Naam","Amount","Mode","Mahine"]].concat(D.pays.map(function(p){return[p.date,p.name,p.amt,p.mode,p.months]}));dl("payments.csv","text/csv","\ufeff"+r.map(function(x){return x.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n"))}
function imp(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x.members||!x.pays)throw 0;D=Object.assign({},def,x);D.exp=D.exp||[];D.att=D.att||{};D.enq=D.enq||[];D.seen=D.seen||[];save();render();alert("Restore ho gaya")}catch(e){alert("Ye sahi backup file nahi hai")}};r.readAsText(f)}
load();$("lock").hidden=false;render();
</script>
</body>
</html>
