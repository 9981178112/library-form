nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(16,24,40,.06);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;color:var(--mut);border-radius:0;padding:9px 1px 8px;font-size:.66rem;font-weight:600}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}

#lock .card{width:100%;max-width:320px;text-align:center;padding:24px}
.enq{padding:12px 0;border-bottom:1px solid var(--line)}.enq:last-child{border:0}
.enq .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.enq small{color:var(--mut);display:block;font-size:.8rem}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.cols{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.cols i{display:block;width:40%;border-radius:4px 4px 0 0;min-height:2px}
.c1{background:var(--ok)}.c2{background:var(--bad)}
.bar span{font-size:.7rem;color:var(--mut);margin-top:4px}
nav{overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}

#title,#lname{font-family:"Yeseva One",Georgia,serif;font-weight:400;letter-spacing:.01em}
</style>
</head>

 +'<div class="card"><b>बैकअप और एक्सपोर्ट</b><p class="sub">डेटा सिर्फ इसी फोन के ब्राउज़र में रहता है। बैकअप ज़रूर लें।</p><div class="row"><button class="g" onclick="exp()">बैकअप डाउनलोड</button><button class="g" onclick="$(\'imp\').click()">बैकअप रिस्टोर</button><button class="g" onclick="csv()">छात्र CSV</button><button class="g" onclick="csvp()">भुगतान CSV</button></div><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"></div>'}
function saveSet(){if(!$("sp").value.trim())return alert("पिन खाली नहीं हो सकता");var s=Math.max(1,+$("ss").value||1),mx=Math.max.apply(null,[0].concat(D.members.map(function(m){return+m.seat})));if(s<mx)return alert("सीट "+mx+" पर छात्र है, इससे कम सीटें नहीं हो सकतीं");D.name=$("sn").value.trim()||"लाइब्रेरी";D.seats=s;D.fee=+$("sf").value||0;D.pin=$("sp").value.trim();save();render();alert("सेव हो गया")}
function dl(name,type,txt){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function exp(){dl("library-backup.json","application/json",JSON.stringify(D))}
function csv(){var r=[["नाम","फोन","सीट","शिफ्ट","फीस","प्रवेश","देय तारीख"]].concat(D.members.map(function(m){return[m.name,m.phone,m.seat,m.shift,m.fee,m.join,m.due]}));dl("members.csv","text/csv","\ufeff"+r.map(function(x){return x.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n"))}
function csvp(){var r=[["तारीख","नाम","राशि","माध्यम","महीने"]].concat(D.pays.map(function(p){return[p.date,p.name,p.amt,p.mode,p.months]}));dl("payments.csv","text/csv","\ufeff"+r.map(function(x){return x.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n"))}
function imp(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x.members||!x.pays)throw 0;D=Object.assign({},def,x);D.exp=D.exp||[];D.att=D.att||{};D.enq=D.enq||[];D.ui=Object.assign({},def.ui,D.ui||{});D.seen=D.seen||[];save();render();alert("रिस्टोर हो गया")}catch(e){alert("यह सही बैकअप फाइल नहीं है")}};r.readAsText(f)}
load();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}applyUI();if(window.matchMedia)matchMedia("(prefers-color-scheme:dark)").addEventListener&&matchMedia("(prefers-color-scheme:dark)").addEventListener("change",function(){if(D.ui.theme==="auto")applyUI()});$("lock").hidden=false;render();
autoPull();seatPush(true);setInterval(autoPull,90000);document.addEventListener("visibilitychange",function(){if(!document.hidden)autoPull()});
</script>
